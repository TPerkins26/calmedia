<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="50%" stop-color="#5a3821"/>
      <stop offset="100%" stop-color="#2c180b"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fff5eb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#woodGrad)"/>
  <rect width="600" height="400" fill="url(#sunGlow)"/>
  
  <!-- Open Notebook / Planner -->
  <g transform="translate(80, 70) rotate(-6)">
    <rect x="0" y="0" width="220" height="260" fill="#fdfbf7" rx="6" filter="drop-shadow(4px 10px 15px rgba(0,0,0,0.5))"/>
    <line x1="25" y1="40" x2="195" y2="40" stroke="#d5c7b3" stroke-width="2"/>
    <line x1="25" y1="70" x2="195" y2="70" stroke="#e8dec8" stroke-width="1.5"/>
    <line x1="25" y1="100" x2="195" y2="100" stroke="#e8dec8" stroke-width="1.5"/>
    <line x1="25" y1="130" x2="195" y2="130" stroke="#e8dec8" stroke-width="1.5"/>
    <line x1="25" y1="160" x2="195" y2="160" stroke="#e8dec8" stroke-width="1.5"/>
    <line x1="25" y1="190" x2="195" y2="190" stroke="#e8dec8" stroke-width="1.5"/>
    <line x1="25" y1="220" x2="160" y2="220" stroke="#e8dec8" stroke-width="1.5"/>
    <!-- Pen -->
    <rect x="180" y="-10" width="10" height="220" fill="#2c3e50" rx="3" transform="rotate(12 185 100)"/>
  </g>

  <!-- Ceramic Coffee Mug Top-Down -->
  <g transform="translate(420, 190)">
    <!-- Saucer Shadow -->
    <ellipse cx="0" cy="8" rx="85" ry="85" fill="#000000" opacity="0.35"/>
    <!-- Saucer -->
    <circle cx="0" cy="0" r="85" fill="#eceff1"/>
    <circle cx="0" cy="0" r="68" fill="#cfd8dc"/>
    <!-- Cup -->
    <circle cx="0" cy="0" r="54" fill="#37474f"/>
    <!-- Coffee Surface -->
    <circle cx="0" cy="0" r="48" fill="#4a2c11"/>
    <!-- Latte Art -->
    <path d="M 0 -25 C 20 -10, 25 15, 0 35 C -25 15, -20 -10, 0 -25 Z" fill="#fff5eb" opacity="0.9"/>
    <circle cx="0" cy="-28" r="6" fill="#fff5eb"/>
  </g>

  <text x="300" y="375" fill="#d7ccc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">FRONT ROOM COFFEEHOUSE • ATHENS, OH</text>
</svg>

