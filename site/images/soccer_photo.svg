<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4d24"/>
      <stop offset="100%" stop-color="#0f2b14"/>
    </linearGradient>
    <radialGradient id="stadiumLight" cx="20%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#ffffcc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#203a43" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="260" fill="url(#skyGrad)"/>
  <rect width="600" height="260" fill="url(#stadiumLight)"/>
  <rect y="240" width="600" height="160" fill="url(#grassGrad)"/>

  <!-- Field markings -->
  <line x1="0" y1="330" x2="600" y2="330" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
  <ellipse cx="300" cy="330" rx="90" ry="35" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
  
  <!-- Stadium Floodlights -->
  <g transform="translate(60, 20)">
    <line x1="0" y1="0" x2="0" y2="150" stroke="#777" stroke-width="4"/>
    <rect x="-25" y="-10" width="50" height="20" fill="#eedd82" rx="4"/>
    <polygon points="0,5 -50,240 180,240" fill="#ffffaa" opacity="0.15"/>
  </g>
  <g transform="translate(540, 20)">
    <line x1="0" y1="0" x2="0" y2="150" stroke="#777" stroke-width="4"/>
    <rect x="-25" y="-10" width="50" height="20" fill="#eedd82" rx="4"/>
    <polygon points="0,5 -180,240 50,240" fill="#ffffaa" opacity="0.15"/>
  </g>

  <!-- Soccer Ball -->
  <g transform="translate(300, 310)">
    <circle cx="0" cy="0" r="26" fill="#fff" filter="drop-shadow(0 6px 10px rgba(0,0,0,0.6))"/>
    <polygon points="0,-12 11,-4 7,10 -7,10 -11,-4" fill="#111"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#222" stroke-width="2"/>
  </g>

  <text x="300" y="375" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1">INTRAMURAL MATCH NIGHT</text>
</svg>

