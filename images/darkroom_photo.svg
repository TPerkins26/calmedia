<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="darkroomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="40%" stop-color="#400b0b"/>
      <stop offset="100%" stop-color="#0d0202"/>
    </linearGradient>
    <radialGradient id="redSafelight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#880000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#darkroomGrad)"/>
  <rect width="600" height="400" fill="url(#redSafelight)"/>
  
  <!-- Hanging line and prints -->
  <line x1="40" y1="90" x2="560" y2="90" stroke="#888" stroke-width="2"/>
  
  <!-- Print 1 -->
  <g transform="translate(80, 85) rotate(-3)">
    <rect x="0" y="5" width="110" height="150" fill="#fff" rx="3" filter="drop-shadow(2px 5px 6px rgba(0,0,0,0.7))"/>
    <rect x="8" y="13" width="94" height="115" fill="#222"/>
    <circle cx="55" cy="65" r="28" fill="#e65c5c"/>
    <rect x="48" y="0" width="14" height="10" fill="#bbb" rx="2"/>
  </g>

  <!-- Print 2 (Centerpiece) -->
  <g transform="translate(235, 85)">
    <rect x="0" y="5" width="130" height="175" fill="#fdfdfd" rx="3" filter="drop-shadow(3px 8px 10px rgba(0,0,0,0.8))"/>
    <rect x="10" y="15" width="110" height="135" fill="#1b1b1b"/>
    <path d="M 15 130 Q 65 50 115 130 Z" fill="#ff7777" opacity="0.8"/>
    <circle cx="65" cy="55" r="16" fill="#ffd4d4"/>
    <rect x="58" y="0" width="14" height="10" fill="#bbb" rx="2"/>
  </g>

  <!-- Print 3 -->
  <g transform="translate(410, 85) rotate(4)">
    <rect x="0" y="5" width="110" height="150" fill="#fff" rx="3" filter="drop-shadow(2px 5px 6px rgba(0,0,0,0.7))"/>
    <rect x="8" y="13" width="94" height="115" fill="#282828"/>
    <line x1="20" y1="40" x2="90" y2="100" stroke="#ff5555" stroke-width="6"/>
    <rect x="48" y="0" width="14" height="10" fill="#bbb" rx="2"/>
  </g>
  
  <text x="300" y="340" fill="#ffaaaa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="1.5">FILM LAB SESSION #04</text>
  <text x="300" y="365" fill="#ff6666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle" opacity="0.8">Verified Event: Digital Photography Studio Lab</text>
</svg>

